name: talaria
version: 0.2.3
description: "Server-side companion for the Talaria iPhone app: records each session's attention state (running, waiting on an approval or question, needs you) across every Hermes backend, and serves it via /talaria; and the app and routine skills (/talaria:app, /talaria:routine)."
author: "Sageware Solutions Inc."
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_approval_request
  - post_approval_response
  - on_human_input_request
  - on_human_input_resolved
